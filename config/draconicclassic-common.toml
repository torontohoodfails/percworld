	# Range: > 1
	draconiumChestReceive = 32000
	#Items that can not go in a Draconium Chest
	chestBlackList = []
	#Items the Draconium Chest will not double
	oreDoublingBlacklist = []
	# Default: 4000000
	# Range: > 1
	celestialCapacity = 4000000
	# Default: 256000
	# Range: > 0
	celestialRainCost = 256000
	# Default: 384000
	# Range: > 0
	celestialStormCost = 384000
	#FE per world tick skipped
	# Default: 320
	# Range: > 0
	celestialTimeCost = 320

#Chaos Guardian
[guardian]
	# Default: 2000
	# Range: 1 ~ 1000000
	chaosGuardianHealth = 2000
	#Guardian attacks can hurt creative-mode players
	guardianCanKillCreative = false
	#Keep the chunks around the guardian loaded while players are within 500 blocks
	chaosGuardianLoading = true
	#Stop the guardian reviving its crystals
	disableGuardianCrystalRespawn = false
	#Breaking the Chaos Crystal does not destroy the island
	disableChaosIslandExplosion = false
