[drops]
	#Draconium Dust dropped by the Ender Dragon (and Chaos Guardian) is this number +/- 10%.
	# Default: 1
	# Range: 0 ~ 1000
	dragonDustLootModifier = 1
	#Spawn a dragon egg every time the dragon is killed, not just the first time.
	dragonEggSpawnOverride = true
	#The Ender Dragon and Chaos Guardian drop a Dragon Heart on death.
	dragonHeartDrop = true

[fusion]
	#How far (in blocks) the fusion core looks for injectors along each axis.
	# Default: 16
	# Range: 2 ~ 64
	injectorRange = 16
	#Injectors charge at most energyPerIngredient / (base - tier * perTier) FE per tick.
	#With unlimited power that is 300 / 220 / 140 / 60 ticks for basic / wyvern / draconic / chaotic.
	# Default: 300
	# Range: 1 ~ 100000
	chargeDivisorBase = 300
	# Default: 80
	# Range: 0 ~ 100000
	chargeDivisorPerTier = 80
	#Extra craft progress per tick by the lowest injector tier used (basic, wyvern, draconic, chaotic).
	#Progress runs 1000 -> 2000 at (2 + boost) per tick.
	craftSpeedBoost = [0, 1, 3, 5]
	#Multiplier applied to the energy cost of every fusion recipe.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	energyMultiplier = 1.0
	#New crafting injectors start in single-item mode.
	injectorSingleItemDefault = false

	[machines.generator]
		# Default: 100000
		# Range: > 1
		capacity = 100000
		#Maximum FE pushed to neighbours per tick.
		# Default: 1000
		# Range: > 1
		output = 1000
		#Fuel burn-ticks consumed per game tick.
		# Default: 6
		# Range: 1 ~ 1000
		burnSpeed = 6
		#FE produced per fuel burn-tick (6 * 14 = 84 FE/t).
		# Default: 14
		# Range: 1 ~ 100000
		energyPerBurnTick = 14

	[machines.energy_infuser]
		# Default: 10000000
		# Range: > 1
		capacity = 10000000
		#Receive rate and item charge rate per tick.
		# Default: 10000000
		# Range: > 1
		transfer = 10000000

