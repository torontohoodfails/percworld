#Wyvern and Draconic armor
[armor]
	#Total shield points of a full Wyvern set (split 15/40/30/15 %), multiplied by (shield capacity level + 1).
	# Default: 256
	# Range: > 0
	wyvernBaseShieldCapacity = 256
	# Default: 512
	# Range: > 0
	draconicBaseShieldCapacity = 512
	#FE to restore one shield point
	# Default: 1000
	# Range: > 0
	wyvernShieldRechargeCost = 1000
	# Default: 1000
	# Range: > 0
	draconicShieldRechargeCost = 1000
	#Entropy recovery per piece, multiplied by (shield recovery level + 1); entropy falls by the mean / 100 each tick.
	# Default: 2.0
	# Range: 0.0 ~ 10000.0
	wyvernShieldRecovery = 2.0
	# Default: 4.0
	# Range: 0.0 ~ 10000.0
	draconicShieldRecovery = 4.0
	# Default: 512000
	# Range: > 1
	wyvernMaxReceive = 512000
	# Default: 1000000
	# Range: > 1
	draconicMaxReceive = 1000000
	#Energy drained from Draconic armor to cancel a death
	# Default: 10000000
	# Range: > 0
	lastStandEnergy = 10000000
	#A death is cancelled (health set to 10) while the shield has more points than this
	# Default: 500.0
	# Range: 0.0 ~ 1.0E9
	shieldSavePoints = 500.0
	enableFlight = true
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	flightSpeedModifier = 1.0
	#Cap for the chestplate flight speed slider in %; -1 = no cap (max 600%)
	# Default: -1
	# Range: -1 ~ 1200
	flightSpeedLimit = -1
	#FE to remove one harmful effect
	# Default: 5000
	# Range: > 0
	helmetCleanseCost = 5000
	# Default: 500
	# Range: > 0
	helmetAutoFeedCost = 500

#Energy Storage Core
[energy_core]
	#Capacity of tiers 1-8 in FE (as text so values above 2^31 work)
	capacity = ["45500000", "273000000", "1640000000", "9880000000", "59300000000", "356000000000", "2140000000000", "9223372036854775807"]
	#How far from the core stabilizers may be
	# Default: 16
	# Range: 2 ~ 64
	stabilizerRange = 16
	#Ticks between automatic structure checks
	# Default: 500
	# Range: 20 ~ 100000
	validateInterval = 500
	#Pylons look for cores in a cube of this half-size, offset this far up (or down)
	# Default: 18
	# Range: 1 ~ 64
	pylonRange = 18

#Energy crystals; each list is basic, wyvern, draconic
[energy_crystals]
	#Internal buffer (also the max transfer per link per tick)
	capacity = [4000000, 16000000, 64000000]
	#Link range in blocks
	linkRange = [32, 64, 127]
	#Max crystal links on a relay
	relayLinks = [8, 16, 32]
	#Max crystal links on an I/O crystal
	ioLinks = [2, 3, 4]
	#Max crystal links on a wireless crystal
	wirelessLinks = [4, 8, 16]
	#Max blocks a wireless crystal can power
	wirelessReceivers = [16, 32, 64]
	#FE per tick per wireless receiver
	wirelessTransfer = [32000, 128000, 512000]

#Draconic Reactor
[reactor]
	#Energy output multiplier
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	outputMultiplier = 1.0
	#Fuel usage multiplier
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	fuelUsageMultiplier = 1.0
	#Scale of the large reactor explosion radius (50-350 blocks by fuel)
	# Default: 1.0
	# Range: 0.01 ~ 10.0
	explosionScale = 1.0
	#Replace the huge explosion with a small one (power 8 plus some lava)
	disableLargeReactorBoom = false
	#Most fuel a core can hold (1296 = one awakened draconium block); 1.12 allowed 15 extra
	# Default: 10383
	# Range: 144 ~ 1000000
	maxFuel = 10383
	#Blocks removed per tick when the explosion detonates (1.12 removed them all in one tick)
	# Default: 20000
	# Range: 100 ~ 10000000
	explosionBlocksPerTick = 20000
	#Minimum ticks between a meltdown starting and the explosion
	# Default: 1200
	# Range: 0 ~ 1000000
	meltdownMinTicks = 1200
	#Random extra ticks added to the meltdown delay
	# Default: 2400
	# Range: 1 ~ 1000000
	meltdownRandomTicks = 2400
	#Ticks counted down after the explosion is calculated
	# Default: 1200
	# Range: 0 ~ 1000000
	finalCountdownTicks = 1200
	#Max shield = fuel x this x 100, max saturation = fuel x this x 1000
	# Default: 96.45061728395062
	# Range: 1.0E-4 ~ 1000000.0
	fuelEnergyFactor = 96.45061728395062
	#Temperature rise offset (where the temperature settles at full saturation)
	# Default: 444.7
	# Range: -1000000.0 ~ 1000000.0
	tempOffset = 444.7
	#Larger values drain the containment field slower
	# Default: 10.923556
	# Range: 1.0E-4 ~ 1000000.0
	fieldDrainDivisor = 10.923556
	#Base fuel conversion per tick
	# Default: 0.001
	# Range: 0.0 ~ 1.0
	baseFuelUsage = 0.001

#Dislocators and magnets
[items]
	# Default: 8
	# Range: 1 ~ 64
	magnetRangeBasic = 8
	# Default: 32
	# Range: 1 ~ 128
	magnetRangeAdvanced = 32
	#Advanced Dislocator teleports per ender pearl
	# Default: 1
	# Range: 1 ~ 1000
	dislocatorUsesPerPearl = 1
	#Item ids magnets will not pull
	itemDislocatorBlacklist = ["appliedenergistics2:crystal_seed", "botania:livingrock", "botania:manatablet"]

